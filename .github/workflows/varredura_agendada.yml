name: Varredura Automática Datajud - GASP

on:
  schedule:
    # Horários programados em UTC (3 horas a mais que o horário oficial de Brasília):
    # 07:00 BRT -> 10:00 UTC
    # 12:00 BRT -> 15:00 UTC
    # 17:00 BRT -> 20:00 UTC
    # Executa de segunda a sexta-feira (1-5)
    - cron: '0 10,15,20 * * 1-5'
  
  # Permite disparar a varredura manualmente pelo painel do GitHub caso necessário
  workflow_dispatch:

jobs:
  executar-varredura:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v3

      - name: Configurar o ambiente Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependências necessárias
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas gspread oauth2client

      - name: Executar robô de varredura nos pendentes
        env:
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
        run: python robo_varredura.py
